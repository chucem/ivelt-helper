# Checks the extension's code on every push to dev or master and on every pull request that
# changes it: every script parses, the manifest is valid and every file it and the extension's
# pages name exists (.github/scripts/check-extension.mjs), and ESLint finds no real mistakes
# (eslint.config.mjs). Node is already on the runner, so nothing is installed but ESLint.

name: Check

on:
  push:
    branches:
      - dev
      - master
    paths:
      - extension/**
      - eslint.config.mjs
      - .github/scripts/check-extension.mjs
      - .github/workflows/check.yml
  pull_request:
    paths:
      - extension/**
      - eslint.config.mjs
      - .github/scripts/check-extension.mjs
      - .github/workflows/check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scripts parse, and every file the manifest and pages name exists
        run: node .github/scripts/check-extension.mjs

      - name: ESLint
        run: npx --yes eslint@10.13.0 extension
