# Publishes a test build from dev as a GitHub pre-release, for users to try before
# a real release. It runs when dev's manifest has a version_name with a dash in it
# (e.g. "2.6.0-beta.1"): it tags v<version_name>, builds the zip and attaches it to a
# release marked "Pre-release", so it never shows as the latest release.
# If that pre-release already exists, it does nothing - bump version_name for a new one.
#
# The notes start with a summary written by AI (Google Gemini, free tier) from the
# commits since the previous release, when the GEMINI_API_KEY secret is set - see
# .github/scripts/ai-release-notes.sh. If the AI notes can't be written, the run fails
# and nothing is published: re-run the failed job, or skip them with "Run workflow ->
# Skip AI release notes" (or the SKIP_AI_NOTES=true repository variable), which
# publishes with the usual notes.
#
# The test build is its own extension, "iVelt Helper v2 (Beta)": the manifest's "key" (the
# same one used when running the code unpacked) pins its own fixed ID,
# mkhocmhicodbokdhfjgamkhebdelcdaa, so it installs next to the store version with its own
# settings. Store releases drop the key (release.yml), and the store sets their ID.
# Google and Dropbox sign-in only accept registered redirect URIs, so
# https://mkhocmhicodbokdhfjgamkhebdelcdaa.chromiumapp.org/ has to be added to the
# Google OAuth client and the Dropbox app next to the store's.

name: Pre-release

on:
  push:
    branches:
      - dev
    paths:
      - extension/manifest.json
      - .github/workflows/prerelease.yml
  workflow_dispatch:
    inputs:
      skip_ai_notes:
        description: 'Skip AI release notes (publish with the usual notes)'
        type: boolean
        default: false

concurrency:
  group: prerelease

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history and tags, so the AI notes can see what changed since the last release

      - name: Read version
        id: version
        run: |
          name=$(jq -r '.version_name // empty' extension/manifest.json)
          if ! [[ "$name" =~ ^[0-9]+(\.[0-9]+){0,3}-[0-9A-Za-z.]+$ ]]; then
            echo "::notice::version_name is \"$name\", not a test version like 2.6.0-beta.1 - nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "zip=dist/ivelt-helper-$name.zip" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" > /dev/null 2>&1; then
            echo "::notice::Pre-release v$name already exists, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.version.outputs.skip == 'false' && steps.version.outputs.exists == 'false'
        run: |
          mkdir -p dist
          cd extension
          # its own name next to the store version (the manifest's key already gives it its own ID)
          jq '.name = .name + " (Beta)"' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          zip -r -X "../${{ steps.version.outputs.zip }}" . -x '_metadata/*'

      - name: Write release notes with AI
        if: steps.version.outputs.skip == 'false' && steps.version.outputs.exists == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_AI_NOTES: ${{ github.event.inputs.skip_ai_notes == 'true' || vars.SKIP_AI_NOTES == 'true' }}
        run: bash .github/scripts/ai-release-notes.sh test

      - name: Create GitHub pre-release
        if: steps.version.outputs.skip == 'false' && steps.version.outputs.exists == 'false'
        run: |
          cat > install.md <<'EOF'
          **Test version** - for trying out new features before they go to the Chrome Web Store.

          ### How to install
          This test version is a separate extension, **iVelt Helper v2 (Beta)**, so you can keep the normal one installed. It has its own settings: the normal version's settings stay as they are.
          1. Download the **ivelt-helper-…zip** below and extract it to a folder you'll keep (Chrome runs the extension from there).
          2. Open `chrome://extensions`, turn on **Developer mode** (top right), click **Load unpacked** and pick that folder.
          3. **Turn off the normal iVelt Helper** with its switch in `chrome://extensions` (no need to remove it). With both on, everything shows twice on the forum.
          4. To go back: turn the beta off (or remove it) and turn the normal version on again.
          5. Google Drive / Dropbox ask you to sign in once more in the beta.

          Please report problems in [Issues](https://github.com/chucem/ivelt-helper/issues) or in the iVelt extension topic.

          ---
          EOF
          # GitHub's usual notes (the pull requests and who made them, new contributors, full
          # changelog), from the tag before this version by number: left to itself GitHub looks
          # back through dev, which never gets master's release commits, so it skipped every
          # release (2.8.0-beta.1 compared to v2.6.0, not v2.7.1)
          tag="${{ steps.version.outputs.tag }}"
          prev=$(bash .github/scripts/previous-tag.sh "$tag" test)
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            ${prev:+-f previous_tag_name="$prev"} --jq .body > changes.md

          # The AI summary (if there is one) goes first, then the install steps, then GitHub's
          # list. Under a summary the list says the same for developers, so it's folded away (it
          # keeps the credit for each change), like in release.yml; without one it's shown
          if [ -s ai-notes.md ]; then
            prs=$(grep -c ' by @.* in https://github.com/.*/pull/' changes.md || true)
            {
              cat ai-notes.md
              printf '\n---\n\n'
              cat install.md
              printf '\n<details>\n<summary>All changes (%s pull requests)</summary>\n\n' "$prs"
              cat changes.md
              printf '\n</details>\n'
            } > notes.md
          else
            { cat install.md; printf '\n'; cat changes.md; } > notes.md
          fi

          gh release create "$tag" "${{ steps.version.outputs.zip }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$tag (test version)" \
            --notes-file notes.md
